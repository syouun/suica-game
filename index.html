/* =========================================================================
 * Layout — scaling, devicePixelRatio, cached container layers
 * ========================================================================= */
const Layout = {
  s: 1,
  dpr: 1,
  ps: 1,
  portrait: false,
  inner: null,
  frame: null,
  resizeTimer: 0,
  apply() {
    const portrait = window.innerWidth / window.innerHeight < 0.9;
    this.portrait = portrait;
    appEl.classList.toggle("portrait", portrait);
    appEl.classList.toggle("landscape", !portrait);
    const rect = stageEl.getBoundingClientRect();
    const V = CONFIG.VIEW;
    const s = Math.max(0.1, Math.min(rect.width / V.w, rect.height / V.h));
    const dpr = window.devicePixelRatio || 1;
    this.s = s;
    this.dpr = dpr;
    const pw = Math.max(1, Math.round(V.w * s * dpr));
    const ph = Math.max(1, Math.round(V.h * s * dpr));
    this.ps = pw / V.w;
    canvas.width = pw;
    canvas.height = ph;
    fieldEl.style.width = (pw / dpr) + "px";
    fieldEl.style.height = (ph / dpr) + "px";
    SpriteCache.build(this.ps);
    this.buildContainer();
    UI.resizeSide();
    watchDpr();
  },
  schedule() {
    clearTimeout(this.resizeTimer);
    this.resizeTimer = setTimeout(() => this.apply(), 100);
  },
  baseTransform(c, ox, oy) {
    const ps = this.ps;
    c.setTransform(ps, 0, 0, ps, (-CONFIG.VIEW.x + (ox || 0)) * ps, (-CONFIG.VIEW.y + (oy || 0)) * ps);
  },
  makeLayer() {
    const c = document.createElement("canvas");
    c.width = canvas.width;
    c.height = canvas.height;
    const g = c.getContext("2d");
    this.baseTransform(g);
    return { c: c, g: g };
  },
  buildContainer() {
    const W = CONFIG.W, H = CONFIG.H, T = CONFIG.T;
    const rng = mulberry32(9917);
    const inner = this.makeLayer();
    let g = inner.g;
    const innerPath = (c, top) => {
      const ri = 10;
      c.moveTo(0, top);
      c.lineTo(0, H - ri);
      c.quadraticCurveTo(0, H, ri, H);
      c.lineTo(W - ri, H);
      c.quadraticCurveTo(W, H, W, H - ri);
      c.lineTo(W, top);
      c.closePath();
    };
    g.beginPath();
    innerPath(g, -4);
    g.fillStyle = "#FFF8E8";
    g.fill();
    g.save();
    g.beginPath();
    innerPath(g, -4);
    g.clip();
    let lg = g.createLinearGradient(0, 0, 14, 0);
    lg.addColorStop(0, "rgba(110,70,30,0.14)");
    lg.addColorStop(1, "rgba(110,70,30,0)");
    g.fillStyle = lg;
    g.fillRect(0, -4, 14, H + 4);
    lg = g.createLinearGradient(W, 0, W - 14, 0);
    lg.addColorStop(0, "rgba(110,70,30,0.14)");
    lg.addColorStop(1, "rgba(110,70,30,0)");
    g.fillStyle = lg;
    g.fillRect(W - 14, -4, 14, H + 4);
    lg = g.createLinearGradient(0, H, 0, H - 14);
    lg.addColorStop(0, "rgba(110,70,30,0.14)");
    lg.addColorStop(1, "rgba(110,70,30,0)");
    g.fillStyle = lg;
    g.fillRect(0, H - 14, W, 14);
    g.fillStyle = "rgba(110,70,30,0.05)";
    g.fillRect(0, H - 30, W, 30);
    g.restore();
    this.inner = inner.c;

    const frame = this.makeLayer();
    g = frame.g;
    const ro = 30, ri = 10, topY = -4;
    const framePath = (c, dy) => {
      c.moveTo(-T, topY + dy);
      c.lineTo(-T, H + T - ro + dy);
      c.quadraticCurveTo(-T, H + T + dy, -T + ro, H + T + dy);
      c.lineTo(W + T - ro, H + T + dy);
      c.quadraticCurveTo(W + T, H + T + dy, W + T, H + T - ro + dy);
      c.lineTo(W + T, topY + dy);
      c.lineTo(W, topY + dy);
      c.lineTo(W, H - ri + dy);
      c.quadraticCurveTo(W, H + dy, W - ri, H + dy);
      c.lineTo(ri, H + dy);
      c.quadraticCurveTo(0, H + dy, 0, H - ri + dy);
      c.lineTo(0, topY + dy);
      c.closePath();
    };
    g.beginPath();
    framePath(g, 6);
    g.arc(-T / 2, topY + 6, T / 2, 0, TAU);
    g.moveTo(W + T, topY + 6);
    g.arc(W + T / 2, topY + 6, T / 2, 0, TAU);
    g.fillStyle = "rgba(110,70,30,0.18)";
    g.fill();
    const wood = g.createLinearGradient(0, topY, 0, H + T);
    wood.addColorStop(0, "#F0C27B");
    wood.addColorStop(1, "#E2A95E");
    g.beginPath();
    framePath(g, 0);
    g.fillStyle = wood;
    g.fill();
    for (const cx of [-T / 2, W + T / 2]) {
      g.beginPath();
      g.arc(cx, topY, T / 2, Math.PI, 0);
      g.closePath();
      g.fillStyle = "#F0C27B";
      g.fill();
    }
    g.save();
    g.beginPath();
    framePath(g, 0);
    g.clip();
    g.strokeStyle = "rgba(122,78,38,0.15)";
    g.lineWidth = 1.5;
    for (let k = 0; k < 3; k++) {
      const off = 3 + k * 5;
      g.beginPath();
      g.moveTo(-off, topY);
      g.quadraticCurveTo(-off + (rng() - 0.5) * 4, H / 2, -off, H + T);
      g.moveTo(W + off, topY);
      g.quadraticCurveTo(W + off + (rng() - 0.5) * 4, H / 2, W + off, H + T);
      const yy = H + 3 + k * 5;
      g.moveTo(-T, yy);
      g.quadraticCurveTo(W / 2, yy + (rng() - 0.5) * 4, W + T, yy);
      g.stroke();
    }
    g.restore();
    g.beginPath();
    g.moveTo(-3, topY);
    g.lineTo(-3, H - ri + 2);
    g.quadraticCurveTo(-3, H + 3, ri - 2, H + 3);
    g.lineTo(W - ri + 2, H + 3);
    g.quadraticCurveTo(W + 3, H + 3, W + 3, H - ri + 2);
    g.lineTo(W + 3, topY);
    g.strokeStyle = "#FADDA8";
    g.lineWidth = 2;
    g.lineCap = "round";
    g.stroke();
    g.beginPath();
    framePath(g, 0);
    g.lineJoin = "round";
    g.strokeStyle = "#7A4E26";
    g.lineWidth = 3;
    g.stroke();
    for (const cx of [-T / 2, W + T / 2]) {
      g.beginPath();
      g.arc(cx, topY, T / 2, Math.PI, 0);
      g.strokeStyle = "#7A4E26";
      g.lineWidth = 3;
      g.stroke();
    }
    this.frame = frame.c;
  }
};
let dprQuery = null;
function watchDpr() {
  if (dprQuery) dprQuery.removeEventListener("change", onDprChange);
  if (!window.matchMedia) return;
  dprQuery = window.matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
  if (dprQuery.addEventListener) dprQuery.addEventListener("change", onDprChange);
}
function onDprChange() { Layout.schedule(); }

/* =========================================================================
 * UI — score count-up, NEXT, evolution ring, result panel
 * ========================================================================= */
const UI = {
  shown: 0,
  from: 0,
  to: 0,
  animStart: 0,
  shownBest: -1,
  nextChangedAt: -1e9,
  nextStage: 1,
  ringDirty: true,
  setScore(target, rt) {
    this.from = this.shown;
    this.to = target;
    this.animStart = rt;
    scoreEl.classList.add("bump");
    void scoreEl.offsetWidth;
    scoreEl.classList.remove("bump");
  },
  resetScore() {
    this.shown = 0;
    this.from = 0;
    this.to = 0;
    scoreEl.textContent = "0";
  },
  update(rt) {
    if (this.shown !== this.to) {
      const t = clamp01((rt - this.animStart) / 400);
      const v = Math.round(this.from + (this.to - this.from) * Easing.outCubic(t));
      if (v !== this.shown) {
        this.shown = v;
        scoreEl.textContent = String(v);
      }
      if (t >= 1 && this.shown !== this.to) {
        this.shown = this.to;
        scoreEl.textContent = String(this.to);
      }
    }
    if (Game.best !== this.shownBest) {
      this.shownBest = Game.best;
      bestEl.textContent = String(Game.best);
    }
    if (rt - this.nextChangedAt < 260 || this.nextDirty) {
      this.drawNext(rt);
      this.nextDirty = rt - this.nextChangedAt < 260;
    }
    if (this.ringDirty) {
      this.drawRing();
      this.ringDirty = false;
    }
  },
  setNext(stage, rt) {
    this.nextStage = stage;
    this.nextChangedAt = rt;
    this.nextDirty = true;
  },
  resizeCanvas(c) {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, c.clientWidth), h = Math.max(1, c.clientHeight);
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    return { w: w, h: h, dpr: dpr };
  },
  resizeSide() {
    this.nextGeom = this.resizeCanvas(nextCanvas);
    this.ringGeom = this.resizeCanvas(ringCanvas);
    this.nextDirty = true;
    this.ringDirty = true;
    this.drawTitleFruits();
  },
  drawNext(rt) {
    const geo = this.nextGeom;
    if (!geo) return;
    const g = nextCanvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const t = clamp01((rt - this.nextChangedAt) / 200);
    const sc = 0.6 + 0.4 * Easing.outBack(t);
    const k = (geo.w * 0.8 / 2) / FRUITS[5].r;
    const r = FRUITS[this.nextStage].r;
    const scale = k * sc * geo.dpr;
    g.setTransform(scale, 0, 0, scale, geo.w * geo.dpr / 2, geo.h * geo.dpr / 2 + r * 0.08 * k * geo.dpr);
    FruitPainter.paint(g, this.nextStage);
  },
  drawRing() {
    const geo = this.ringGeom;
    if (!geo) return;
    const g = ringCanvas.getContext("2d");
    const d = geo.dpr, w = geo.w;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, ringCanvas.width, ringCanvas.height);
    g.setTransform(d, 0, 0, d, 0, 0);
    const cx = w / 2, cy = geo.h / 2, R = w * 0.36;
    g.beginPath();
    g.arc(cx, cy, R, 0, TAU);
    g.strokeStyle = "rgba(138,90,43,0.25)";
    g.lineWidth = 2;
    g.stroke();
    g.fillStyle = "rgba(138,90,43,0.45)";
    for (let k = 0; k < 3; k++) {
      const a = (-90 + 16 + k * 120 + 32.7 * 1.5) * Math.PI / 180;
      const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      const tx = -Math.sin(a), ty = Math.cos(a);
      const nx = Math.cos(a), ny = Math.sin(a);
      const sz = Math.max(3, w * 0.025);
      g.beginPath();
      g.moveTo(x + tx * sz, y + ty * sz);
      g.lineTo(x - tx * sz + nx * sz * 0.8, y - ty * sz + ny * sz * 0.8);
      g.lineTo(x - tx * sz - nx * sz * 0.8, y - ty * sz - ny * sz * 0.8);
      g.closePath();
      g.fill();
    }
    for (let i = 1; i <= MAX_STAGE; i++) {
      const a = (-90 + (i - 1) * 360 / MAX_STAGE) * Math.PI / 180;
      const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      const disp = w * (0.045 + 0.050 * (i - 1) / 10);
      const sc = disp / FRUITS[i].r;
      g.save();
      g.globalAlpha = (i <= 5 || Game.reached[i]) ? 1 : 0.35;
      g.translate(x, y);
      g.scale(sc, sc);
      FruitPainter.paint(g, i);
      g.restore();
    }
  },
  showResult(isRecord) {
    $("resultScore").textContent = String(Game.score);
    $("resultBest").textContent = String(Game.best);
    const nr = $("newRecord");
    nr.classList.remove("on");
    resultEl.classList.remove("hidden");
    void resultEl.offsetWidth;
    resultEl.classList.add("show");
    if (isRecord) { void nr.offsetWidth; nr.classList.add("on"); }
    setTimeout(() => { try { $("retryBtn").focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 0);
  },
  updateAutoBadge() {
    autoBadge.classList.toggle("hidden", !(Game.auto && Game.state === "playing" && !Game.paused));
  },
  drawTitleFruits() {
    const box = $("titleFruits");
    const dpr = window.devicePixelRatio || 1;
    box.textContent = "";
    for (const stage of [1, 3, 6, 8, 11]) {
      const c = document.createElement("canvas");
      const size = 30;
      c.width = Math.round(size * dpr);
      c.height = Math.round(size * dpr);
      const g = c.getContext("2d");
      const k = (size * 0.42) / FRUITS[stage].r * dpr;
      g.setTransform(k, 0, 0, k, c.width / 2, c.height / 2 + FRUITS[stage].r * 0.1 * k);
      FruitPainter.paint(g, stage);
      box.appendChild(c);
    }
  },
  hideResult() {
    resultEl.classList.remove("show");
    resultEl.classList.add("hidden");
    $("newRecord").classList.remove("on");
  }
};

/* =========================================================================
 * Game — states, dropping, scoring, game over, retry
 * ========================================================================= */
let rt = 0;            // real-time clock (ms) used by effects; frozen while paused
const Game = {
  state: "ready",
  world: null,
  score: 0,
  best: parseInt(store.get("fruitdrop.highscore", "0"), 10) || 0,
  bestAtStart: 0,
  current: 1,
  next: 1,
  dropX: CONFIG.W / 2,
  cooldownUntil: 0,
  waitingVisibleAt: 0,
  wasCooling: false,
  overTimer: 0,
  overState: false,
  nearState: false,
  reached: [],
  forcedStage: 0,
  noGameOver: false,
  go: null,
  paused: false,
  auto: false,          // AUTO PLAY mode
  autoEnabled: true,    // debug/test switch
  idleMs: 0,            // time since the last user input (counts only while playing and not paused)
  init() {
    this.newWorld();
    this.current = randomDropStage();
    this.next = randomDropStage();
    UI.setNext(this.next, rt);
  },
  newWorld() {
    if (this.world) this.world.destroy();
    this.world = new PhysicsWorld({
      hooks: {
        onMerge: (info) => this.onMerge(info),
        onImpact: (f, x, y, speed, both, normal) => this.onImpact(f, x, y, speed, normal)
      }
    });
  },
  start() {
    if (this.state !== "ready") return;
    Sound.unlock();
    startOverlay.classList.add("hidden");
    this.state = "playing";
    this.bestAtStart = this.best;
    this.waitingVisibleAt = rt;
    this.resetIdle();
    pauseBtn.disabled = false;
    BGM.start();
  },
  retry() {
    this.newWorld();
    Effects.reset();
    this.score = 0;
    UI.resetScore();
    this.overTimer = 0;
    this.overState = false;
    this.nearState = false;
    this.cooldownUntil = 0;
    this.wasCooling = false;
    this.waitingVisibleAt = rt;
    this.reached = [];
    this.go = null;
    this.current = this.forcedStage || randomDropStage();
    this.next = randomDropStage();
    UI.setNext(this.next, rt);
    UI.ringDirty = true;
    UI.hideResult();
    Loop.acc = 0;
    this.bestAtStart = this.best;
    this.state = "playing";
    this.setPaused(false);
    this.resetIdle();
    pauseBtn.disabled = false;
    BGM.start();
  },
  setPaused(p) {
    const next = !!p && this.state === "playing";
    if (next === this.paused) return;
    this.paused = next;
    pauseOverlay.classList.toggle("hidden", !next);
    pauseBtn.classList.toggle("paused", next);
    Input.keys.left = Input.keys.right = false;
    Input.activePointer = null;
    BGM.setDuck(next);
    UI.updateAutoBadge();
    if (next) {
      try { $("resumeBtn").focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }
  },
  togglePause() { this.setPaused(!this.paused); },
  resetIdle() {
    this.idleMs = 0;
    if (this.auto) {
      this.auto = false;
      AutoPlay.reset();
      UI.updateAutoBadge();
    }
  },
  // any real user input: leave AUTO immediately and restart the 5 s idle timer
  noteInput() {
    if (this.state !== "playing") return;
    this.resetIdle();
  },
  canDrop() { return this.state === "playing" && !this.paused && this.world.time >= this.cooldownUntil; },
  clampX(x, stage) {
    const r = FRUITS[stage].r;
    return clamp(x, r + 1, CONFIG.W - r - 1);
  },
  drop() {
    if (!this.canDrop()) return false;
    const stage = this.current;
    const x = this.clampX(this.dropX, stage);
    const f = this.world.addFruit(stage, x, CONFIG.DROP_Y, 0, 0);
    f.spawnTime = this.world.time;
    Sound.drop();
    this.current = this.forcedStage || this.next;
    this.next = randomDropStage();
    UI.setNext(this.next, rt);
    this.cooldownUntil = this.world.time + CONFIG.DROP_COOLDOWN;
    this.wasCooling = true;
    return true;
  },
  onMerge(info) {
    const watermelonPair = info.stage === MAX_STAGE;
    const ns = watermelonPair ? MAX_STAGE : info.stage + 1;
    const pts = FRUITS[ns].points;
    this.score += pts;
    if (this.score > this.best) this.best = this.score;
    UI.setScore(this.score, rt);
    if (!this.reached[ns]) { this.reached[ns] = true; UI.ringDirty = true; }
    const R = FRUITS[ns].r;
    if (info.fruit) info.fruit.bornRt = rt;
    const special = ns === MAX_STAGE;
    if (watermelonPair) {
      Effects.addVanish(MAX_STAGE, info.a.x, info.a.y, info.a.angle);
      Effects.addVanish(MAX_STAGE, info.b.x, info.b.y, info.b.angle);
    }
    Effects.juice(info.x, info.y, ns, R, special ? 3 : 1, special ? 1.3 : 1);
    Effects.ripple(info.x, info.y, R, 0, 1.8);
    Effects.popup(info.x, info.y - R * 0.2, pts, ns, special);
    if (special) {
      Effects.ripple(info.x, info.y, R, 120, 2.4);
      Effects.shake(8, 500);
      Effects.confettiBurst(info.x, info.y);
      Effects.doFlash();
      Sound.watermelon();
    } else {
      Sound.merge(ns);
    }
  },
  onImpact(f, x, y, speed, normal) {
    if (speed <= 600) return;
    if (this.world.time - f.lastDust < 300) return;
    f.lastDust = this.world.time;
    Effects.dustPuff(x, y, speed, normal);
  },
  afterStep() {
    const w = this.world;
    let over = false, near = false;
    for (let i = 0; i < w.fruits.length; i++) {
      const f = w.fruits[i];
      if (w.time - f.spawnTime < CONFIG.GRACE_MS) continue;
      const top = f.body.position.y - f.r;
      if (top < CONFIG.DEAD_Y) { over = true; break; }
      if (top < CONFIG.DEAD_Y + CONFIG.NEAR_MARGIN) near = true;
    }
    this.overState = over;
    this.nearState = near;
    if (over) {
      this.overTimer += CONFIG.STEP_MS;
      if (this.overTimer >= CONFIG.OVER_MS - 1e-6 && !this.noGameOver) this.gameOver();
    } else {
      this.overTimer = 0;
    }
  },
  gameOver() {
    this.state = "gameover";
    this.auto = false;
    AutoPlay.reset();
    UI.updateAutoBadge();
    pauseBtn.disabled = true;
    BGM.stop(false);
    Sound.gameOver();
    const isRecord = this.score > this.bestAtStart;
    if (this.score > this.best) this.best = this.score;
    store.set("fruitdrop.highscore", this.best);
    const order = this.world.fruits.slice().sort((a, b) => a.body.position.y - b.body.position.y);
    const interval = order.length ? Math.min(60, 1500 / order.length) : 0;
    const start = rt;
    order.forEach((f, i) => { f.grayStart = start + 300 + i * interval; });
    const lastGray = order.length ? start + 300 + (order.length - 1) * interval + 200 : start + 300;
    this.go = { start: start, order: order, resultAt: lastGray + 300, shown: false, isRecord: isRecord };
  },
  // called once per frame while not paused
  update(dt) {
    if (this.state === "playing") {
      this.idleMs += dt;
      if (!this.auto && this.autoEnabled && this.idleMs >= CONFIG.AUTO_IDLE_MS) {
        this.auto = true;
        AutoPlay.reset();
        UI.updateAutoBadge();
      }
      if (this.auto) {
        AutoPlay.update(dt);
      } else {
        let dir = 0;
        if (Input.keys.left) dir -= 1;
        if (Input.keys.right) dir += 1;
        if (dir) this.dropX = this.clampX(this.dropX + dir * CONFIG.KEY_SPEED * dt / 1000, this.current);
      }
      const cooling = this.world.time < this.cooldownUntil;
      if (this.wasCooling && !cooling) this.waitingVisibleAt = rt;
      this.wasCooling = cooling;
    }
    if (this.state === "gameover" && this.go && !this.go.shown && rt >= this.go.resultAt) {
      this.go.shown = true;
      this.state = "result";
      UI.showResult(this.go.isRecord);
    }
  }
};

/* =========================================================================
 * AutoPlay — demo play after 5 s without input
 * ========================================================================= */
const AutoPlay = {
  plan: null,            // { targetX, dropAt (game time), stage }
  reset() { this.plan = null; },
  // where would a fruit of radius r dropped at x first come to rest (roughly)?
  landing(x, r, fruits) {
    let y = CONFIG.H - r, hit = null;
    for (const f of fruits) {
      const p = f.body.position;
      const dx = Math.abs(p.x - x), rr = f.r + r;
      if (dx >= rr) continue;
      const cy = p.y - Math.sqrt(rr * rr - dx * dx);
      if (cy < y) { y = cy; hit = f; }
    }
    return { y: y, hit: hit };
  },
  choose(stage) {
    const r = FRUITS[stage].r;
    const fruits = Game.world.fruits;
    let best = null;
    const lo = r + 1, hi = CONFIG.W - r - 1;
    const n = 40;
    for (let i = 0; i <= n; i++) {
      const x = lo + (hi - lo) * i / n;
      const land = this.landing(x, r, fruits);
      let score = (land.y / CONFIG.H) * 30;                       // prefer low spots
      if (land.hit) {
        if (land.hit.stage === stage) {
          score += 110 + stage * 6 - Math.abs(land.hit.body.position.x - x) * 0.3;   // land right on a twin
        } else if (land.hit.stage < stage) {
          score -= 12 * (stage - land.hit.stage);                    // avoid burying smaller fruits
        }
      }
      for (const f of fruits) {
        if (f === land.hit || f.stage !== stage) continue;
        const d = Math.hypot(f.body.position.x - x, f.body.position.y - land.y);
        if (d < (f.r + r) * 1.35) score += 55;                      // a twin right next to the landing spot
      }
      if (land.y - r < CONFIG.DEAD_Y + 40) score -= 220;             // too close to the deadline
      score += Math.random() * 18;                                   // spread the drops a little
      if (!best || score > best.score) best = { x: x, score: score };
    }
    return best.x;
  },
  update(dt) {
    if (!Game.canDrop()) return;
    if (!this.plan || this.plan.stage !== Game.current) {
      this.plan = {
        stage: Game.current,
        targetX: this.choose(Game.current),
        dropAt: Game.world.time + rand(CONFIG.AUTO_DELAY_MIN, CONFIG.AUTO_DELAY_MAX)
      };
    }
    const dx = this.plan.targetX - Game.dropX;
    const maxStep = Math.max(60, Math.abs(dx) * 5) * dt / 1000;      // ease out, at least 60 u/s
    Game.dropX = Game.clampX(Math.abs(dx) <= maxStep ? this.plan.targetX : Game.dropX + Math.sign(dx) * maxStep, Game.current);
    if (Game.world.time >= this.plan.dropAt && Math.abs(this.plan.targetX - Game.dropX) < 0.5) {
      Game.drop();
      this.plan = null;
    }
  }
};

/* =========================================================================
 * Input — pointer + keyboard
 * ========================================================================= */
const Input = {
  keys: { left: false, right: false },
  activePointer: null,
  lastX: null,
  lastY: null,
  toLogicalX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * CONFIG.VIEW.w + CONFIG.VIEW.x;
  },
  init() {
    const unlock = () => Sound.unlock();
    window.addEventListener("pointerdown", unlock, true);
    window.addEventListener("keydown", unlock, true);

    // user-activity detection for AUTO PLAY (capture phase, before anything else)
    window.addEventListener("pointerdown", () => Game.noteInput(), true);
    window.addEventListener("touchstart", () => Game.noteInput(), { capture: true, passive: true });
    window.addEventListener("keydown", () => Game.noteInput(), true);
    window.addEventListener("wheel", () => Game.noteInput(), { capture: true, passive: true });
    window.addEventListener("pointermove", (e) => {
      // some browsers send pointermove without real movement (layout changes); ignore those
      if (e.clientX === this.lastX && e.clientY === this.lastY) return;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      Game.noteInput();
    }, true);

    $("startBtn").addEventListener("click", () => Game.start());
    stageEl.addEventListener("pointerdown", (e) => {
      if (e.target.closest && (e.target.closest("#result") || e.target.closest(".overlay"))) return;
      if (Game.state !== "playing" || Game.paused) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      this.activePointer = e.pointerId;
      try { stageEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      Game.dropX = Game.clampX(this.toLogicalX(e.clientX), Game.current);
      e.preventDefault();
    });
    stageEl.addEventListener("pointermove", (e) => {
      if (Game.state !== "playing" || Game.paused) return;
      if (e.pointerType === "mouse" || this.activePointer === e.pointerId) {
        Game.dropX = Game.clampX(this.toLogicalX(e.clientX), Game.current);
      }
    });
    const end = (e, doDrop) => {
      if (this.activePointer !== e.pointerId) return;
      this.activePointer = null;
      if (doDrop && Game.state === "playing" && !Game.paused) {
        Game.dropX = Game.clampX(this.toLogicalX(e.clientX), Game.current);
        Game.drop();
      }
    };
    stageEl.addEventListener("pointerup", (e) => end(e, true));
    stageEl.addEventListener("pointercancel", (e) => end(e, false));

    $("retryBtn").addEventListener("click", () => { if (Game.state === "result") Game.retry(); });
    $("resumeBtn").addEventListener("click", (e) => { Game.setPaused(false); e.currentTarget.blur(); });
    pauseBtn.addEventListener("click", (e) => { Game.togglePause(); e.currentTarget.blur(); });
    muteBtn.addEventListener("click", (e) => {
      Sound.unlock();
      Sound.setMuted(!Sound.muted);
      muteBtn.classList.toggle("muted", Sound.muted);
      e.currentTarget.blur();
    });
    muteBtn.classList.toggle("muted", Sound.muted);

    window.addEventListener("keydown", (e) => {
      const tag = e.target && e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (e.code === "KeyP" || e.code === "Escape") {
        e.preventDefault();
        if (!e.repeat) Game.togglePause();
        return;
      }
      if (e.code === "KeyM") {
        Sound.unlock();
        Sound.setMuted(!Sound.muted);
        muteBtn.classList.toggle("muted", Sound.muted);
        return;
      }
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (e.repeat) return;
        if (Game.state === "ready") Game.start();
        else if (Game.paused) Game.setPaused(false);
        else if (Game.state === "playing" && e.code === "Space") Game.drop();
        else if (Game.state === "result") Game.retry();
        return;
      }
      if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
        e.preventDefault();
        if (Game.state !== "playing" || Game.paused) return;
        if (e.code === "ArrowLeft") this.keys.left = true; else this.keys.right = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft") this.keys.left = false;
      if (e.code === "ArrowRight") this.keys.right = false;
    });
    window.addEventListener("blur", () => { this.keys.left = false; this.keys.right = false; });

    const prevent = (e) => { if (!(e.target.closest && e.target.closest("#debugPanel"))) e.preventDefault(); };
    document.addEventListener("touchmove", prevent, { passive: false });
    document.addEventListener("gesturestart", prevent, { passive: false });
    document.addEventListener("dblclick", prevent, { passive: false });
    document.addEventListener("contextmenu", prevent);
  }
};

/* =========================================================================
 * Rendering
 * ========================================================================= */
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d * t;
}
function fruitPose(f, alpha) {
  const p = f.body.position;
  if (!RENDER.interpolate) return { x: p.x, y: p.y, a: f.body.angle };
  return { x: f.px + (p.x - f.px) * alpha, y: f.py + (p.y - f.py) * alpha, a: lerpAngle(f.pa, f.body.angle, alpha) };
}
function drawSprite(sp, x, y, angle, scale) {
  ctx.save();
  ctx.translate(x, y);
  if (angle) ctx.rotate(angle);
  if (scale !== 1) ctx.scale(scale, scale);
  ctx.drawImage(sp.canvas, -sp.half, -sp.half, sp.half * 2, sp.half * 2);
  ctx.restore();
}
function popScale(f) {
  if (f.bornRt === null) return 1;
  const t = (rt - f.bornRt) / 250;
  if (t >= 1) { f.bornRt = null; return 1; }
  return 0.6 + 0.4 * Easing.outBack(clamp01(t), 4.0);
}

function render() {
  const ps = Layout.ps;
  const W = CONFIG.W, H = CONFIG.H;
  const alpha = Game.state === "playing" ? clamp01(Loop.acc / CONFIG.STEP_MS) : Loop.frozenAlpha;
  const sh = Effects.shakeOffset(rt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.setTransform(1, 0, 0, 1, sh.x * ps, sh.y * ps);
  ctx.drawImage(Layout.inner, 0, 0);
  Layout.baseTransform(ctx, sh.x, sh.y);

  const showWaiting = Game.state === "playing" && Game.world.time >= Game.cooldownUntil;   // stays visible while paused
  const wr = FRUITS[Game.current].r;
  const wx = Game.clampX(Game.dropX, Game.current);
  if (showWaiting) {
    ctx.beginPath();
    ctx.moveTo(wx, CONFIG.DROP_Y + wr);
    ctx.lineTo(wx, H);
    ctx.strokeStyle = "rgba(120,85,50,0.20)";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  const fruits = Game.world.fruits;
  for (let i = 0; i < fruits.length; i++) {
    const f = fruits[i];
    const pose = fruitPose(f, alpha);
    f.rx = pose.x; f.ry = pose.y; f.ra = pose.a;
    drawSprite(SpriteCache.color[f.stage], pose.x, pose.y, pose.a, popScale(f));
  }
  Effects.drawLow(ctx);

  ctx.setTransform(1, 0, 0, 1, sh.x * ps, sh.y * ps);
  ctx.drawImage(Layout.frame, 0, 0);
  Layout.baseTransform(ctx, sh.x, sh.y);

  // deadline
  ctx.beginPath();
  ctx.moveTo(0, CONFIG.DEAD_Y);
  ctx.lineTo(W, CONFIG.DEAD_Y);
  if (Game.overState || Game.state === "gameover" || Game.state === "result") {
    const blink = Game.state === "playing" ? 0.25 + 0.75 * (0.5 + 0.5 * Math.cos(TAU * rt / 400)) : 1;
    ctx.strokeStyle = "rgba(229,57,53," + blink.toFixed(3) + ")";
    ctx.lineWidth = 3;
  } else {
    ctx.strokeStyle = Game.nearState ? "rgba(200,90,70,0.55)" : "rgba(200,90,70,0.25)";
    ctx.lineWidth = 2;
  }
  ctx.setLineDash([8, 8]);
  ctx.stroke();
  ctx.setLineDash([]);

  // rail
  ctx.beginPath();
  ctx.moveTo(0, CONFIG.RAIL_Y);
  ctx.lineTo(W, CONFIG.RAIL_Y);
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = "rgba(138,90,43,0.22)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  if (showWaiting) {
    const t = clamp01((rt - Game.waitingVisibleAt) / 120);
    drawSprite(SpriteCache.color[Game.current], wx, CONFIG.DROP_Y, 0, 0.6 + 0.4 * Easing.outBack(t));
  }

  Effects.drawHigh(ctx, FONT);

  if (Effects.flash) {
    const t = Effects.flash.age / Effects.flash.life;
    ctx.globalAlpha = 0.35 * (1 - Easing.outQuad(t));
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(CONFIG.VIEW.x - 20, CONFIG.VIEW.y - 20, CONFIG.VIEW.w + 40, CONFIG.VIEW.h + 40);
    ctx.globalAlpha = 1;
  }

  if (Game.go) {
    const t = clamp01((rt - Game.go.start) / 500);
    ctx.fillStyle = "rgba(40,25,15," + (0.45 * Easing.outQuad(t)).toFixed(3) + ")";
    ctx.fillRect(CONFIG.VIEW.x - 20, CONFIG.VIEW.y - 20, CONFIG.VIEW.w + 40, CONFIG.VIEW.h + 40);
    for (const f of Game.go.order) {
      if (rt < f.grayStart) continue;
      ctx.globalAlpha = clamp01((rt - f.grayStart) / 200);
      drawSprite(SpriteCache.getGray(f.stage), f.rx, f.ry, f.ra, 1);
    }
    ctx.globalAlpha = 1;
  }

  if (DEBUG) Debug.draw(ctx, alpha);
}

/* =========================================================================
 * Loop — fixed time step with an accumulator
 * ========================================================================= */
const Loop = {
  acc: 0,
  last: null,
  raf: 0,
  frozenAlpha: 1,
  paused: false,
  stepsThisSecond: 0,
  tick(frameDt) {
    const dt = Math.min(frameDt, CONFIG.MAX_FRAME_MS);
    if (Game.paused) {
      // physics, drops, particles, idle (AUTO) timer and the game-over timer all stand still
      UI.update(rt);
      return;
    }
    if (Game.state === "playing") {
      this.acc += dt;
      let steps = 0;
      while (this.acc >= CONFIG.STEP_MS - 1e-6 && steps < CONFIG.MAX_STEPS_PER_FRAME) {
        Game.world.step();
        Game.afterStep();
        this.acc -= CONFIG.STEP_MS;
        steps++;
        this.stepsThisSecond++;
        if (Game.state !== "playing") break;
      }
      if (this.acc < 0) this.acc = 0;
      if (steps === CONFIG.MAX_STEPS_PER_FRAME && this.acc >= CONFIG.STEP_MS) this.acc = 0;
      if (Game.state !== "playing") this.frozenAlpha = clamp01(this.acc / CONFIG.STEP_MS);
    }
    const edt = Math.min(dt, CONFIG.MAX_EFFECT_DT);
    rt += edt;
    Effects.update(edt);
    Game.update(edt);
    UI.update(rt);
  },
  frame(ts) {
    Loop.raf = requestAnimationFrame(Loop.frame);
    if (Loop.last === null) Loop.last = ts;
    const dt = ts - Loop.last;
    Loop.last = ts;
    Loop.tick(dt);
    render();
    if (DEBUG) Debug.frame(ts);
  },
  start() {
    if (this.raf) return;
    this.last = null;
    this.raf = requestAnimationFrame(this.frame);
  },
  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  }
};

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    Loop.paused = true;
    Loop.stop();
    Input.keys.left = Input.keys.right = false;
    Sound.suspend();
  } else {
    Loop.paused = false;
    Loop.acc = 0;
    Sound.resume();
    Loop.start();
  }
});
window.addEventListener("pagehide", () => { store.set("fruitdrop.highscore", Game.best); });
window.addEventListener("resize", () => Layout.schedule());
window.addEventListener("orientationchange", () => Layout.schedule());

    $("dbgInterp").addEventListener("change", (e) => { RENDER.interpolate = e.target.checked; });
    $("dbgNoOver").addEventListener("change", (e) => { Game.noGameOver = e.target.checked; });
    $("dbgAuto").addEventListener("change", (e) => { Game.autoEnabled = e.target.checked; if (!e.target.checked) Game.resetIdle(); });
    $("dbgMeasure").addEventListener("click", () => this.showMeasure(Tests.measureAll()));
    $("dbgStack").addEventListener("click", () => this.showStack(Tests.stackTest()));
    $("dbg30").addEventListener("click", () => Tests.thirty());
    window.addEventListener("keydown", (e) => {
      const tag = e.target && e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      const map = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4, Digit5: 5, Digit6: 6, Digit7: 7, Digit8: 8, Digit9: 9, Digit0: 10, Minus: 11 };
      if (map[e.code]) { Game.forcedStage = map[e.code]; Game.current = map[e.code]; }
      if (e.code === "Backspace") Game.forcedStage = 0;
    });
    sync();
  },
  showEffective() {
    const eff = $("dbgEff");
    if (!eff) return;
    eff.textContent = "実効値 果物-壁: e=" + Math.max(PHYSICS.restitutionWall, PHYSICS.restitutionFruit) +
      " μ=" + Math.min(PHYSICS.frictionWall, PHYSICS.frictionFruit) +
      " μs=" + Math.max(PHYSICS.frictionStaticWall, PHYSICS.frictionStaticFruit) +
      " / 果物同士: e=" + PHYSICS.restitutionFruit + " μ=" + PHYSICS.frictionFruit + " μs=" + PHYSICS.frictionStaticFruit;
  },
  showMeasure(res) {
    const cell = (m) => "<td class='" + (m.ok ? "ok" : "ng") + "'>" + m.text + "</td>";
    let h = "<h4>計測テスト（目標との差）</h4><table><tr><th>段階</th><th>落下</th><th>跳ね</th><th>回数</th><th>停止</th></tr>";
    for (const r of res.rows) {
      h += "<tr><td>" + r.stage + " " + FRUITS[r.stage].name + "</td>" + cell(r.fallEval) + cell(r.bounceEval) + cell(r.countEval) + cell(r.settleEval) + "</tr>";
    }
    h += "</table><div>目標: 落下0.60〜0.80秒 / 跳ね5〜10% / 1〜2回 / 停止1.5秒以内</div>";
    $("dbgOut").innerHTML = h;
    $("dbgJson").value = JSON.stringify(res, null, 1);
  },
  showStack(res) {
    $("dbgOut").innerHTML = "<h4>積載テスト（30秒）</h4><table>" +
      "<tr><td>スイカの下の果物（5秒→30秒）</td><td>" + res.underStart + "→" + res.under + "個</td></tr>" +
      "<tr><td>最大めり込み（果物同士）</td><td class='" + (res.maxPen <= 2 ? "ok" : "ng") + "'>" + res.maxPen.toFixed(3) + "u</td></tr>" +
      "<tr><td>最大めり込み（床）</td><td class='" + (res.maxFloorPen <= 2 ? "ok" : "ng") + "'>" + res.maxFloorPen.toFixed(3) + "u</td></tr>" +
      "<tr><td>沈み込み（5秒→30秒）</td><td class='" + (Math.abs(res.sink) <= 1 ? "ok" : "ng") + "'>" + res.sink.toFixed(3) + "u</td></tr>" +
      "<tr><td>床より下</td><td class='" + (res.belowFloor === 0 ? "ok" : "ng") + "'>" + res.belowFloor + "個</td></tr></table>";
    $("dbgJson").value = JSON.stringify(res, null, 1);
  },
  frame(ts) {
    this.frames++;
    if (ts - this.fpsT >= 500) {
      const span = ts - this.fpsT;
      this.fps = this.frames * 1000 / span;
      this.sps = Loop.stepsThisSecond * 1000 / span;
      this.frames = 0;
      Loop.stepsThisSecond = 0;
      this.fpsT = ts;
    }
  },
  draw(c, alpha) {
    Layout.baseTransform(c, 0, 0);
    const fruits = Game.world.fruits;
    if (this.show.bodies) {
      c.strokeStyle = "#00C853";
      c.lineWidth = 1;
      for (const f of fruits) {
        const v = f.body.vertices;
        c.beginPath();
        c.moveTo(v[0].x, v[0].y);
        for (let i = 1; i < v.length; i++) c.lineTo(v[i].x, v[i].y);
        c.closePath();
        c.stroke();
      }
      c.strokeStyle = "rgba(0,200,83,0.5)";
      for (const w of Game.world.walls) {
        const v = w.vertices;
        c.beginPath();
        c.moveTo(v[0].x, v[0].y);
        for (let i = 1; i < v.length; i++) c.lineTo(v[i].x, v[i].y);
        c.closePath();
        c.stroke();
      }
    }
    if (this.show.vectors) {
      c.strokeStyle = "#E53935";
      c.lineWidth = 1.5;
      for (const f of fruits) {
        const p = f.body.position, v = Body.getVelocity(f.body);
        c.beginPath();
        c.moveTo(p.x, p.y);
        c.lineTo(p.x + v.x * 6, p.y + v.y * 6);
        c.stroke();
      }
    }
    if (this.show.stats) {
      c.font = "11px monospace";
      c.textAlign = "left";
      c.textBaseline = "top";
      c.fillStyle = "rgba(0,0,0,0.65)";
      const lines = [
        "FPS " + this.fps.toFixed(1) + "  steps/s " + this.sps.toFixed(1),
        "fruits " + fruits.length + "  bodies " + Composite.allBodies(Game.world.engine.world).length + "  fx " + Effects.count(),
        "auto " + (Game.auto ? "ON" : "off") + "  idle " + (Game.idleMs / 1000).toFixed(1) + "s  paused " + Game.paused + "  bgm " + BGM.playing,
        "rescue " + Game.world.rescueCount + "  wallfix " + Game.world.wallClampCount + "  over " + Math.round(Game.overTimer) + "ms  t " + (Game.world.time / 1000).toFixed(1) + "s  α " + alpha.toFixed(2)
      ];
      lines.forEach((l, i) => c.fillText(l, CONFIG.VIEW.x + 4, CONFIG.VIEW.y + 4 + i * 13));
    }
  }
};

/* =========================================================================
 * Tests — measurement and stacking (isolated worlds, run synchronously)
 * ========================================================================= */
const Tests = {
  TARGET: { fall: [0.6, 0.8], bounce: [0.05, 0.10], count: [1, 2], settle: [0, 1.5] },
  evalRange(v, range, fmt) {
    const ok = v !== null && v >= range[0] - 1e-9 && v <= range[1] + 1e-9;
    let diff = 0;
    if (v === null) diff = NaN;
    else if (v < range[0]) diff = v - range[0];
    else if (v > range[1]) diff = v - range[1];
    return { value: v, ok: ok, diff: diff, text: v === null ? "—" : fmt(v) + (ok ? "" : " (" + (diff > 0 ? "+" : "") + fmt(diff) + ")") };
  },
  measure(stage) {
    let contactT = null;
    let fruit = null;
    const world = new PhysicsWorld({
      merge: false,
      hooks: {
        onWallContact: (f, label) => { if (label === "floor" && contactT === null && f === fruit) contactT = world.time; }
      }
    });
    fruit = world.addFruit(stage, CONFIG.W / 2, CONFIG.DROP_Y, 0, 0);
    const r = fruit.r;
    const restY = CONFIG.H - r;
    const dropH = restY - CONFIG.DROP_Y;
    let peakY = null, goingUp = false, peakDone = false;
    let bounces = 0, airborne = false;
    let settleStart = null, settledAt = null;
    const trace = [];
    for (let i = 0; i < 600; i++) {
      world.step();
      const p = fruit.body.position;
      const v = velOf(fruit.body);
      const av = Math.abs(Body.getAngularVelocity(fruit.body) * 60);
      if (i % 2 === 0) trace.push([Math.round(world.time), +p.y.toFixed(2)]);
      if (contactT === null) continue;
      if (!peakDone) {
        if (v.y < -1e-3) {
          goingUp = true;
          if (peakY === null || p.y < peakY) peakY = p.y;
        } else if (goingUp && v.y > 0) {
          peakDone = true;
        }
      }
      const gap = restY - p.y;
      if (!airborne && gap > 0.5) { airborne = true; bounces++; }
      else if (airborne && gap <= 0.5) airborne = false;
      const sp = Math.hypot(v.x, v.y);
      if (sp < 3 && av < 0.1) {
        if (settleStart === null) settleStart = world.time;
        if (world.time - settleStart >= 200 - 1e-6) { settledAt = settleStart; break; }
      } else {
        settleStart = null;
      }
    }
    world.destroy();
    const fall = contactT === null ? null : contactT / 1000;
    const bounce = peakY === null ? 0 : (restY - peakY) / dropH;
    const settle = settledAt === null || contactT === null ? null : (settledAt - contactT) / 1000;
    const T = this.TARGET;
    return {
      stage: stage,
      fall: fall, bounce: bounce, bounceCount: bounces, settle: settle,
      fallEval: this.evalRange(fall, T.fall, (v) => v.toFixed(3) + "s"),
      bounceEval: this.evalRange(bounce, T.bounce, (v) => (v * 100).toFixed(2) + "%"),
      countEval: this.evalRange(bounces, T.count, (v) => String(Math.round(v))),
      settleEval: this.evalRange(settle, T.settle, (v) => v.toFixed(3) + "s"),
      trace: trace
    };
  },
  measureAll() {
    const rows = [3, 1, 5].map((s) => this.measure(s));
    return { physics: Object.assign({}, PHYSICS), rows: rows };
  },
  stackTest(options) {
    const o = options || {};
    const world = new PhysicsWorld({ merge: false });
    const smalls = [];
    const r1 = FRUITS[1].r, r2 = FRUITS[2].r;
    for (let i = 0; i < 16; i++) smalls.push(world.addFruit(1, r1 + 0.5 + i * (2 * r1 + 0.5), CONFIG.H - r1 - 0.5, 0, 0));
    for (let i = 0; i < 15; i++) smalls.push(world.addFruit(1, 2 * r1 + 0.5 + i * (2 * r1 + 0.5), CONFIG.H - r1 - 2 * r1 * 0.87 - 1, 0, 0));
    for (let i = 0; i < 11; i++) smalls.push(world.addFruit(2, r2 + 4 + i * (2 * r2 + 1.5), CONFIG.H - 3.2 * r1 - r2 - 2, 0, 0));
    for (let i = 0; i < 90; i++) world.step();
    const wm = world.addFruit(11, CONFIG.W / 2 + (o.offsetX || 0), CONFIG.H - 4 * r1 - 2 * r2 - FRUITS[11].r - 10, 0, 0);
    const steps = o.steps || 1800;
    let maxPen = 0, maxFloorPen = 0, y2 = null, underStart = 0;
    const all = world.fruits;
    const countUnder = () => {
      const wp = wm.body.position;
      let n = 0;
      for (const f of smalls) {
        const p = f.body.position;
        if (Math.abs(p.x - wp.x) < wm.r && p.y > wp.y) n++;
      }
      return n;
    };
    for (let i = 0; i < steps; i++) {
      world.step();
      if (i === 300) { y2 = wm.body.position.y; underStart = countUnder(); }
      if (i >= 120 && i % 3 === 0) {
        for (let a = 0; a < all.length; a++) {
          const fa = all[a], pa = fa.body.position;
          const fp = pa.y + fa.r - CONFIG.H;
          if (fp > maxFloorPen) maxFloorPen = fp;
          for (let b = a + 1; b < all.length; b++) {
            const fb = all[b], pb = fb.body.position;
            const pen = fa.r + fb.r - Math.hypot(pa.x - pb.x, pa.y - pb.y);
            if (pen > maxPen) maxPen = pen;
          }
        }
      }
    }
    let endPen = 0;
    for (let a = 0; a < all.length; a++) {
      for (let b = a + 1; b < all.length; b++) {
        const pa = all[a].body.position, pb = all[b].body.position;
        const pen = all[a].r + all[b].r - Math.hypot(pa.x - pb.x, pa.y - pb.y);
        if (pen > endPen) endPen = pen;
      }
    }
    const wp = wm.body.position;
    const under = countUnder();
    let belowFloor = 0;
    for (const f of smalls) {
      if (f.body.position.y + f.r > CONFIG.H + 2) belowFloor++;
    }
    const res = {
      physics: Object.assign({}, PHYSICS),
      seconds: steps / 60,
      fruits: all.length,
      under: under,
      underStart: underStart,
      maxPen: maxPen,
      endPen: endPen,
      maxFloorPen: maxFloorPen,
      sink: wp.y - y2,
      belowFloor: belowFloor,
      rescue: world.rescueCount,
      wallClamp: world.wallClampCount
    };
    world.destroy();
    return res;
  },
  thirty() {
    let n = 0;
    Game.noGameOver = true;
    const cb = $("dbgNoOver");
    if (cb) cb.checked = true;
    const timer = setInterval(() => {
      if (Game.state !== "playing" || n >= 40) { clearInterval(timer); return; }
      const st = 1 + Math.floor(Math.random() * 6);
      const r = FRUITS[st].r;
      Game.world.addFruit(st, rand(r + 1, CONFIG.W - r - 1), CONFIG.DROP_Y, 0, 0).spawnTime = Game.world.time;
      n++;
    }, 150);
  }
};

/* =========================================================================
 * Boot
 * ========================================================================= */
function boot() {
  if (!M) {
    startOverlay.querySelector(".sub").textContent = "物理エンジンを初期化できませんでした。再読み込みしてください。";
    return;
  }
  Input.init();
  Game.init();
  Layout.apply();
  UI.ringDirty = true;
  if (DEBUG) {
    Debug.init();
    window.__fd = {
      Game: Game, PHYSICS: PHYSICS, PHYSICS_DEFAULTS: PHYSICS_DEFAULTS, FRUITS: FRUITS, CONFIG: CONFIG, Tests: Tests, Effects: Effects, Loop: Loop, RENDER: RENDER, Layout: Layout,
      get world() { return Game.world; },
      AutoPlay: AutoPlay, BGM: BGM, Sound: Sound,
      start() { Game.start(); },
      reset() { Game.retry(); },
      pause(p) { Game.setPaused(p === undefined ? !Game.paused : p); return Game.paused; },
      spawn(stage, x, y, vx, vy) {
        const f = Game.world.addFruit(stage, x, y, vx || 0, vy || 0);
        f.spawnTime = Game.world.time;
        return f.id;
      },
      pin(id) {
        const f = Game.world.fruits.find((q) => q.id === id);
        if (f) Body.setStatic(f.body, true);
      },
      drop(x, stage) {
        if (stage) Game.current = stage;
        Game.dropX = x;
        return Game.drop();
      },
      stepFrames(hz, seconds) {
        const n = Math.round(hz * seconds);
        for (let i = 0; i < n; i++) Loop.tick(1000 / hz);
        return { frames: n, time: Game.world.time };
      },
      renderOnce() { render(); },
      getState() {
        return {
          state: Game.state, score: Game.score, best: Game.best, time: Game.world.time,
          paused: Game.paused, auto: Game.auto, idleMs: Game.idleMs, bgm: BGM.playing,
          overTimer: Game.overTimer, overState: Game.overState, rescue: Game.world.rescueCount, wallClamp: Game.world.wallClampCount,
          bodies: Composite.allBodies(Game.world.engine.world).length,
          effects: Effects.count(),
          listeners: Object.keys(Game.world.engine.events || {}).reduce((s, k) => s + Game.world.engine.events[k].length, 0),
          fruits: Game.world.fruits.map((f) => ({ id: f.id, stage: f.stage, r: f.r, x: f.body.position.x, y: f.body.position.y, angle: f.body.angle }))
        };
      }
    };
  }
  Loop.start();
}
boot();

})();
</script>
