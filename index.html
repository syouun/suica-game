/* =========================================================================
 * Tests — measurement and stacking (isolated worlds, run synchronously)
 * ========================================================================= */
const Tests = {
  TARGET: { fall: [0.6, 0.8], bounce: [0.05, 0.10], count: [1, 2], settle: [0, 1.5] },
  evalRange(v, range, fmt) {
    const ok = v !== null && v >= range[0] - 1e-9 && v <= range[1] + 1e-9;
    let diff = 0;
    if (v === null) diff = NaN;
    else if (v < range[0]) diff = v - range[0];
    else if (v > range[1]) diff = v - range[1];
    return { value: v, ok: ok, diff: diff, text: v === null ? "—" : fmt(v) + (ok ? "" : " (" + (diff > 0 ? "+" : "") + fmt(diff) + ")") };
  },
  measure(stage) {
    let contactT = null;
    let fruit = null;
    const world = new PhysicsWorld({
      merge: false,
      hooks: {
        onWallContact: (f, label) => { if (label === "floor" && contactT === null && f === fruit) contactT = world.time; }
      }
    });
    fruit = world.addFruit(stage, CONFIG.W / 2, CONFIG.DROP_Y, 0, 0);
    const r = fruit.r;
    const restY = CONFIG.H - r;
    const dropH = restY - CONFIG.DROP_Y;
    let peakY = null, goingUp = false, peakDone = false;
    let bounces = 0, airborne = false;
    let settleStart = null, settledAt = null;
    const trace = [];
    for (let i = 0; i < 600; i++) {
      world.step();
      const p = fruit.body.position;
      const v = velOf(fruit.body);
      const av = Math.abs(Body.getAngularVelocity(fruit.body) * 60);
      if (i % 2 === 0) trace.push([Math.round(world.time), +p.y.toFixed(2)]);
      if (contactT === null) continue;
      if (!peakDone) {
        if (v.y < -1e-3) {
          goingUp = true;
          if (peakY === null || p.y < peakY) peakY = p.y;
        } else if (goingUp && v.y > 0) {
          peakDone = true;
        }
      }
      const gap = restY - p.y;
      if (!airborne && gap > 0.5) { airborne = true; bounces++; }
      else if (airborne && gap <= 0.5) airborne = false;
      const sp = Math.hypot(v.x, v.y);
      if (sp < 3 && av < 0.1) {
        if (settleStart === null) settleStart = world.time;
        if (world.time - settleStart >= 200 - 1e-6) { settledAt = settleStart; break; }
      } else {
        settleStart = null;
      }
    }
    world.destroy();
    const fall = contactT === null ? null : contactT / 1000;
    const bounce = peakY === null ? 0 : (restY - peakY) / dropH;
    const settle = settledAt === null || contactT === null ? null : (settledAt - contactT) / 1000;
    const T = this.TARGET;
    return {
      stage: stage,
      fall: fall, bounce: bounce, bounceCount: bounces, settle: settle,
      fallEval: this.evalRange(fall, T.fall, (v) => v.toFixed(3) + "s"),
      bounceEval: this.evalRange(bounce, T.bounce, (v) => (v * 100).toFixed(2) + "%"),
      countEval: this.evalRange(bounces, T.count, (v) => String(Math.round(v))),
      settleEval: this.evalRange(settle, T.settle, (v) => v.toFixed(3) + "s"),
      trace: trace
    };
  },
  measureAll() {
    const rows = [3, 1, 5].map((s) => this.measure(s));
    return { physics: Object.assign({}, PHYSICS), rows: rows };
  },
  stackTest(options) {
    const o = options || {};
    const world = new PhysicsWorld({ merge: false });
    const smalls = [];
    const r1 = FRUITS[1].r, r2 = FRUITS[2].r;
    for (let i = 0; i < 16; i++) smalls.push(world.addFruit(1, r1 + 0.5 + i * (2 * r1 + 0.5), CONFIG.H - r1 - 0.5, 0, 0));
    for (let i = 0; i < 15; i++) smalls.push(world.addFruit(1, 2 * r1 + 0.5 + i * (2 * r1 + 0.5), CONFIG.H - r1 - 2 * r1 * 0.87 - 1, 0, 0));
    for (let i = 0; i < 11; i++) smalls.push(world.addFruit(2, r2 + 4 + i * (2 * r2 + 1.5), CONFIG.H - 3.2 * r1 - r2 - 2, 0, 0));
    for (let i = 0; i < 90; i++) world.step();
    const wm = world.addFruit(11, CONFIG.W / 2 + (o.offsetX || 0), CONFIG.H - 4 * r1 - 2 * r2 - FRUITS[11].r - 10, 0, 0);
    const steps = o.steps || 1800;
    let maxPen = 0, maxFloorPen = 0, y2 = null, underStart = 0;
    const all = world.fruits;
    const countUnder = () => {
      const wp = wm.body.position;
      let n = 0;
      for (const f of smalls) {
        const p = f.body.position;
        if (Math.abs(p.x - wp.x) < wm.r && p.y > wp.y) n++;
      }
      return n;
    };
    for (let i = 0; i < steps; i++) {
      world.step();
      if (i === 300) { y2 = wm.body.position.y; underStart = countUnder(); }
      if (i >= 120 && i % 3 === 0) {
        for (let a = 0; a < all.length; a++) {
          const fa = all[a], pa = fa.body.position;
          const fp = pa.y + fa.r - CONFIG.H;
          if (fp > maxFloorPen) maxFloorPen = fp;
          for (let b = a + 1; b < all.length; b++) {
            const fb = all[b], pb = fb.body.position;
            const pen = fa.r + fb.r - Math.hypot(pa.x - pb.x, pa.y - pb.y);
            if (pen > maxPen) maxPen = pen;
          }
        }
      }
    }
    let endPen = 0;
    for (let a = 0; a < all.length; a++) {
      for (let b = a + 1; b < all.length; b++) {
        const pa = all[a].body.position, pb = all[b].body.position;
        const pen = all[a].r + all[b].r - Math.hypot(pa.x - pb.x, pa.y - pb.y);
        if (pen > endPen) endPen = pen;
      }
    }
    const wp = wm.body.position;
    const under = countUnder();
    let belowFloor = 0;
    for (const f of smalls) {
      if (f.body.position.y + f.r > CONFIG.H + 2) belowFloor++;
    }
    const res = {
      physics: Object.assign({}, PHYSICS),
      seconds: steps / 60,
      fruits: all.length,
      under: under,
      underStart: underStart,
      maxPen: maxPen,
      endPen: endPen,
      maxFloorPen: maxFloorPen,
      sink: wp.y - y2,
      belowFloor: belowFloor,
      rescue: world.rescueCount,
      wallClamp: world.wallClampCount
    };
    world.destroy();
    return res;
  },
  thirty() {
    let n = 0;
    Game.noGameOver = true;
    const cb = $("dbgNoOver");
    if (cb) cb.checked = true;
    const timer = setInterval(() => {
      if (Game.state !== "playing" || n >= 40) { clearInterval(timer); return; }
      const st = 1 + Math.floor(Math.random() * 6);
      const r = FRUITS[st].r;
      Game.world.addFruit(st, rand(r + 1, CONFIG.W - r - 1), CONFIG.DROP_Y, 0, 0).spawnTime = Game.world.time;
      n++;
    }, 150);
  }
};

/* =========================================================================
 * Boot
 * ========================================================================= */
function boot() {
  if (!M) {
    startOverlay.querySelector(".small").textContent = "物理エンジンを読み込めませんでした。再読み込みしてください。";
    return;
  }
  Input.init();
  Game.init();
  Layout.apply();
  UI.ringDirty = true;
  if (DEBUG) {
    Debug.init();
    window.__fd = {
      Game: Game, PHYSICS: PHYSICS, PHYSICS_DEFAULTS: PHYSICS_DEFAULTS, FRUITS: FRUITS, CONFIG: CONFIG, Tests: Tests, Effects: Effects, Loop: Loop, RENDER: RENDER, Layout: Layout,
      get world() { return Game.world; },
      start() { Game.start(); },
      reset() { Game.retry(); },
      spawn(stage, x, y, vx, vy) {
        const f = Game.world.addFruit(stage, x, y, vx || 0, vy || 0);
        f.spawnTime = Game.world.time;
        return f.id;
      },
      pin(id) {
        const f = Game.world.fruits.find((q) => q.id === id);
        if (f) Body.setStatic(f.body, true);
      },
      drop(x, stage) {
        if (stage) Game.current = stage;
        Game.dropX = x;
        return Game.drop();
      },
      stepFrames(hz, seconds) {
        const n = Math.round(hz * seconds);
        for (let i = 0; i < n; i++) Loop.tick(1000 / hz);
        return { frames: n, time: Game.world.time };
      },
      renderOnce() { render(); },
      getState() {
        return {
          state: Game.state, score: Game.score, best: Game.best, time: Game.world.time,
          overTimer: Game.overTimer, overState: Game.overState, rescue: Game.world.rescueCount, wallClamp: Game.world.wallClampCount,
          bodies: Composite.allBodies(Game.world.engine.world).length,
          effects: Effects.count(),
          listeners: Object.keys(Game.world.engine.events || {}).reduce((s, k) => s + Game.world.engine.events[k].length, 0),
          fruits: Game.world.fruits.map((f) => ({ id: f.id, stage: f.stage, r: f.r, x: f.body.position.x, y: f.body.position.y, angle: f.body.angle }))
        };
      }
    };
  }
  Loop.start();
}
boot();

})();
</script>
